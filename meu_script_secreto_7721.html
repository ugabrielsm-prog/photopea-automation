<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: white; background: #333; padding: 10px; text-align: center; }
        button { background: #1a73e8; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; font-weight: bold; border-radius: 4px; }
        button:hover { background: #1557b0; }
        p { font-size: 12px; color: #ccc; text-align: left; }
    </style>
</head>
<body>
    <h3>Automação de Camadas</h3>
    <p>1. Abra o arquivo PSD no Photopea.</p>
    <p>2. Clique no botão abaixo para rodar a sequência completa.</p>
    <button onclick="enviarScript()">EXECUTAR SISTEMA COMPLETO</button>

    <script>
        function enviarScript() {
            const meuScript = `
                (function() {
                    var doc = app.activeDocument;

                    // --- SCRIPT 1: ORGANIZAR CAMADAS (Seu script original) ---
                    function organizeLayers() {
                        var layers = doc.layers;
                        var arteFolder = null;

                        for (var i = 0; i < layers.length; i++) {
                            if (layers[i].typename === "LayerSet" && layers[i].name === "arte") {
                                arteFolder = layers[i];
                                break;
                            }
                        }
                        if (!arteFolder) {
                            arteFolder = layers.add();
                            arteFolder.name = "arte";
                        }

                        function moveAndRemoveFolders(layerSet, targetFolder) {
                            for (var i = layerSet.length - 1; i >= 0; i--) {
                                var layer = layerSet[i];
                                if (layer.typename === "LayerSet" && layer !== arteFolder) {
                                    moveAndRemoveFolders(layer.layers, targetFolder);
                                    layer.remove();
                                } else if (layer !== arteFolder) {
                                    layer.move(targetFolder, ElementPlacement.INSIDE);
                                }
                            }
                        }
                        moveAndRemoveFolders(layers, arteFolder);
                    }

                    // --- SCRIPT 2: RENOMEAR COM ÍNDICE (Seu script original) ---
                    function renameLayersWithIndex(layerSet, index) {
                        for (var i = layerSet.length - 1; i >= 0; i--) {
                            var layer = layerSet[i];
                            var formattedIndex = String(index).padStart(2, "0");
                            
                            if (layer.layers) {
                                layer.name = formattedIndex + " - " + layer.name;
                                index = renameLayersWithIndex(layer.layers, index);
                            } else {
                                layer.name = formattedIndex + " - " + layer.name;
                                index++;
                            }
                        }
                        return index;
                    }

                    // --- EXECUÇÃO EM SEQUÊNCIA ---
                    organizeLayers(); // Primeiro organiza tudo na pasta "arte"
                    
                    var pastaArte = null;
                    for(var j=0; j<doc.layerSets.length; j++){
                        if(doc.layerSets[j].name === "arte") { pastaArte = doc.layerSets[j]; break; }
                    }

                    if (pastaArte) {
                        renameLayersWithIndex(pastaArte.layers, 1); // Depois renomeia o que está lá dentro
                    }

                    // --- FINALIZAÇÃO E EXPORTAÇÃO EM LOTE ---
                    alert("Organização e Indexação concluídas! Salve o PSD. Em seguida, exportaremos as camadas.");
                    doc.saveToOE("psd");

                    var camadasParaExportar = pastaArte.layers;
                    for (var k = 0; k < camadasParaExportar.length; k++) {
                        // Esconde tudo e mostra apenas uma
                        for (var m = 0; m < camadasParaExportar.length; m++) { camadasParaExportar[m].visible = false; }
                        camadasParaExportar[k].visible = true;

                        // Aplica o TRIM (Corta partes transparentes)
                        try { doc.trim(TrimType.TRANSPARENT); } catch(e) {}

                        // Exporta como PNG
                        doc.saveToOE("png");

                        // Desfaz o Trim para a próxima camada
                        doc.activeHistoryState = doc.historyStates[doc.historyStates.length - 2];
                    }
                })();
            `;
            window.parent.postMessage(meuScript, "*");[cite: 3]
        }
    </script>
</body>
</html>
