<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: white; background: #333; padding: 15px; text-align: center; }
        button { background: #1a73e8; color: white; border: none; padding: 15px; cursor: pointer; width: 100%; font-weight: bold; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        button:hover { background: #1557b0; }
        .instrucoes { font-size: 12px; color: #bbb; text-align: left; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>
    <h3>Sistema de Lote Profissional</h3>
    <button onclick="rodarSistema()">EXECUTAR AGORA</button>
    
    <div class="instrucoes">
        <b>Passo a passo:</b><br>
        1. Abra seu PSD.<br>
        2. Clique no botão azul acima.<br>
        3. O script vai organizar, indexar e perguntar onde salvar o PSD e os PNGs.
    </div>

    <script>
    function rodarSistema() {
        const codigoMaster = `
        (function() {
            var doc = app.activeDocument;
            if(!doc) { alert("Abra um PSD primeiro!"); return; }

            // --- 1. CRIAÇÃO DA PASTA "ARTE" (SEGURANÇA) ---
            var arteFolder = null;
            for (var i = 0; i < doc.layerSets.length; i++) {
                if (doc.layerSets[i].name === "arte") { arteFolder = doc.layerSets[i]; break; }
            }
            if (!arteFolder) { 
                arteFolder = doc.layerSets.add(); 
                arteFolder.name = "arte"; 
            }

            // --- 2. MOVER CAMADAS (Lógica exluirpastas_2.jsx corrigida) ---
            function moverTudo(origem, destino) {
                for (var j = origem.length - 1; j >= 0; j--) {
                    var camada = origem[j];
                    if (camada === arteFolder) continue;

                    if (camada.typename === "LayerSet") {
                        moverTudo(camada.layers, destino);
                        camada.remove(); // Remove apenas pastas vazias
                    } else {
                        camada.move(destino, ElementPlacement.INSIDE); //[cite: 5]
                    }
                }
            }
            moverTudo(doc.layers, arteFolder);

            // --- 3. INDEXAÇÃO (Lógica indice2_2.jsx corrigida) ---
            function renomearComIndice(camadas, startIdx) {
                var count = startIdx;
                for (var k = camadas.length - 1; k >= 0; k--) {
                    var item = camadas[k];
                    var prefixo = String(count).padStart(2, "0");
                    item.name = prefixo + " - " + item.name; //
                    count++;
                }
            }
            renomearComIndice(arteFolder.layers, 1);

            // --- 4. EXPORTAÇÃO EM LOTE ---
            alert("Organização concluída! Escolha a pasta para o PSD.");
            doc.saveToOE("psd");

            var listaExport = arteFolder.layers;
            for (var m = 0; m < listaExport.length; m++) {
                // Esconder todas
                for (var n = 0; n < listaExport.length; n++) { listaExport[n].visible = false; }
                
                listaExport[m].visible = true;
                
                // Trim e Save PNG
                try { doc.trim(TrimType.TRANSPARENT); } catch(e) {}
                doc.saveToOE("png");
                
                // Undo Trim
                doc.activeHistoryState = doc.historyStates[doc.historyStates.length - 2];
            }
            alert("Processo de lote finalizado!");
        })();
        `;
        window.parent.postMessage(codigoMaster, "*"); // Envia para o Photopea[cite: 3]
    }
    </script>
</body>
</html>
