<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; color: white; background: #333; padding: 10px; text-align: center;}
        button { background: #1a73e8; color: white; border: none; padding: 12px; cursor: pointer; width: 100%; font-weight: bold; border-radius: 4px;}
        button:hover { background: #1557b0; }
        p { font-size: 12px; color: #ccc; text-align: left;}
    </style>
</head>
<body>
    <h3>Automação de Camadas</h3>
    <p>1. Abra o arquivo PSD.</p>
    <p>2. Clique abaixo:</p>
    <button onclick="enviarScript()">EXECUTAR LOTE</button>

    <script>
        function enviarScript() {
            const meuScript = `
                function processar() {
                    var doc = app.activeDocument;
                    
                    // SEGURANÇA: Cria uma camada temporária para o projeto nunca ficar vazio
                    var tempLayer = doc.artLayers.add();
                    tempLayer.name = "TEMP_SAFETY";

                    // 1. ORGANIZAÇÃO (Pasta "arte")
                    var arteFolder = null;
                    for (var i = 0; i < doc.layerSets.length; i++) {
                        if (doc.layerSets[i].name === "arte") { arteFolder = doc.layerSets[i]; break; }
                    }
                    if (!arteFolder) { arteFolder = doc.layerSets.add(); arteFolder.name = "arte"; }

                    // Move camadas e limpa pastas vazias
                    function mover(origem, destino) {
                        for (var j = origem.length - 1; j >= 0; j--) {
                            var layer = origem[j];
                            if (layer === arteFolder || layer.name === "TEMP_SAFETY") continue;
                            if (layer.typename === "LayerSet") {
                                mover(layer.layers, destino);
                                layer.remove(); 
                            } else {
                                layer.move(destino, ElementPlacement.INSIDE);
                            }
                        }
                    }
                    mover(doc.layers, arteFolder);

                    // 2. INDEXAÇÃO (01, 02...)
                    var camadas = arteFolder.layers;
                    for (var k = camadas.length - 1; k >= 0; k--) {
                        var idx = String(camadas.length - k).padStart(2, "0");
                        camadas[k].name = idx + " - " + camadas[k].name;
                    }

                    // Remove a camada de segurança agora que já temos as outras
                    tempLayer.remove();

                    // 3. EXPORTAÇÃO
                    alert("Organização concluída! Salve o PSD e iniciaremos os PNGs.");
                    doc.saveToOE("psd");
                    
                    for (var m = 0; m < camadas.length; m++) {
                        for (var x = 0; x < camadas.length; x++) { camadas[x].visible = false; }
                        camadas[m].visible = true;
                        try { doc.trim(TrimType.TRANSPARENT); } catch(e) {}
                        doc.saveToOE("png");
                        doc.activeHistoryState = doc.historyStates[doc.historyStates.length - 2];
                    }
                }
                processar();
            `;
            window.parent.postMessage(meuScript, "*");[cite: 3]
        }
    </script>
</body>
</html>
